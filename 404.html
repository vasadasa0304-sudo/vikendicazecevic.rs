<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranica nije pronađena · Vikendica Zečević Zlatar</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: 'Source Sans 3', system-ui, -apple-system, Segoe UI, Helvetica, sans-serif;
      color: #2a2a26;
      background: #f4f1ea;
      text-align: center;
    }
    .wrap { max-width: 32rem; }
    .code {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #4f6b54;
    }
    h1 {
      margin: 0.6rem 0 0.4rem;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: -0.02em;
      color: #233429;
    }
    p { margin: 0 0 1.8rem; line-height: 1.65; color: #5b5b52; }
    p .en { display: block; margin-top: 0.35rem; font-size: 0.95rem; color: #7a7a70; }
    a.home {
      display: inline-block;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      background: #233429;
      color: #f4f1ea;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    a.home:hover { background: #2e4435; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <h1>Stranica nije pronađena</h1>
    <p>
      Tražena stranica ne postoji ili je premeštena.
      <span class="en">The page you were looking for could not be found.</span>
    </p>
    <a class="home" href="/">Nazad na početnu · Back to home</a>
  </main>
</body>
</html>
